[package]
name = "promkit-widgets"
version = "0.5.0"
edition = "2024"
authors = ["ynqa <un.pensiero.vano@gmail.com>"]
description = "Widgets for promkit"
repository = "https://github.com/ynqa/promkit"
license = "MIT"
readme = "README.md"

[features]
default = []
all = ["checkbox", "jsontree", "listbox", "serde", "spinner", "status", "text", "texteditor", "tree"]
checkbox = ["listbox"]
jsontree = ["dep:serde_json", "dep:rayon"]
listbox = []
serde = ["dep:serde", "dep:termcfg"]
spinner = ["dep:tokio"]
status = ["text"]
text = []
texteditor = []
tree = []

[dependencies]
anyhow = { workspace = true }
promkit-core = { path = "../promkit-core", version = "=0.3.0" }

# Optional dependencies
rayon = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
termcfg = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[dev-dependencies]
# Enable `jsontree` feature when `jsonz` testing
promkit-widgets = { path = ".", features = ["jsontree"] }
toml = "0.9.8"
