[workspace]
resolver = "2"
members = [
  "examples/*",
  "promkit",
  "promkit-core",
  "promkit-derive",
  "promkit-widgets",
  "tests/*",
]

[workspace.dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
bitflags = "2.13.1"
crossbeam-skiplist = "0.1.3"
crossterm = { version = "0.29.0", features = ["use-dev-tty", "event-stream", "serde"] }
csv = "1.3.1"
futures = "0.3.34"
radix_trie = "0.3.0"
rayon = "1.12.0"
serde = "1.0.229"
serde_json = { version = "1.0.151", features = ["preserve_order"] }
serde_yaml = "0.9.34"
termcfg = { version = "0.2.0", features = ["crossterm_0_29_0"] }
termharness = "0.3.0"
tokio = { version = "1.53.1", features = ["full"] }
thiserror = "2.0.20"
unicode-width = "0.2.2"
