[package]
name = "yaml"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anyhow = { workspace = true }
clap = { version = "4.5.60", features = ["derive"] }
promkit = { path = "../../promkit", features = ["runtime", "terminal-session", "yaml", "text"] }
tokio = { workspace = true }

[[bin]]
name = "yaml"
path = "src/yaml.rs"
