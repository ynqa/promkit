[package]
name = "readline"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anyhow = { workspace = true }
promkit = { path = "../../promkit", features = [
    "runtime",
    "terminal-session",
    "validate",
    "prefixsearch",
    "text",
    "texteditor",
] }
tokio = { workspace = true }

[[bin]]
name = "readline"
path = "src/readline.rs"
