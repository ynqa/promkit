[package]
name = "repl"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anyhow = { workspace = true }
futures = { workspace = true }
promkit = { path = "../../promkit", features = ["terminal-session"] }
promkit-widgets = { path = "../../promkit-widgets", features = ["texteditor"] }
tokio = { workspace = true }

[[bin]]
name = "repl"
path = "src/repl.rs"
